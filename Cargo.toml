[package]
name = "mosh-client"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A from-scratch, embeddable Rust client for the mosh mobile-shell protocol: AES-128-OCB3 datagrams, the SSP state-sync protocol, roaming over UDP"
repository = "https://github.com/at-least/mosh-client"
keywords = ["mosh", "udp", "terminal", "roaming", "ssp"]
categories = ["network-programming"]

# Exact pins, conch-style: this implements a byte-level wire protocol —
# not a tolerant one — and every constant was read out of the
# mosh-1.4.0 sources (see SPEC.md).
[dependencies]
ocb3 = { version = "=0.2.0", default-features = false, features = ["alloc"] }
aes = { version = "=0.9.3", features = ["zeroize"] }
flate2 = "=1.1.10"
zeroize = "=1.9.0"
base64ct = { version = "=1.8.3", features = ["alloc"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lib]
name = "mosh_client"
